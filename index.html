<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <title>Bản đồ Du lịch Núi Sập</title>

    <!-- 1. THƯ VIỆN FONT & MAPLIBRE -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <!-- 2. SUPABASE & TOAST (Thông báo) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="toast.css" />
    <script src="toast.js"></script>

    <!-- 3. CSS GIAO DIỆN CHÍNH -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- LOADER -->
    <div id="global-loader">
      <div class="spinner"></div>
      <div style="font-weight: 600; color: #1e293b">Đang tải dữ liệu...</div>
    </div>

    <!-- BẢN ĐỒ -->
    <div id="map"></div>

    <!-- THANH TÌM KIẾM CHUẨN GOOGLE & MENU LỌC -->
    <div class="top-control-group">
      <div id="search-container" class="searchbar">
        <div class="searchbar-wrapper">
          <div class="searchbar-left">
            <svg
              class="searchbar-icon"
              focusable="false"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
            >
              <path
                d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
              ></path>
            </svg>
          </div>
          <div class="searchbar-center">
            <input
              type="text"
              class="searchbar-input"
              id="search-input"
              placeholder="Tìm địa điểm..."
              autocomplete="off"
            />
          </div>
          <div class="searchbar-right">
            <button
              id="voice-search-btn"
              class="voice-btn"
              title="Tìm kiếm bằng giọng nói"
            >
              <i class="fa-solid fa-microphone"></i>
            </button>
          </div>
        </div>
        <ul id="search-results"></ul>
      </div>

      <button id="mobile-filter-toggle" class="filter-toggle-btn">
        <i class="fa-solid fa-bars"></i>
      </button>

      <div id="filter-menu" class="filter-dropdown">
        <button class="filter-btn active" data-filter="all">
          <i class="fa-solid fa-layer-group" style="width: 20px"></i> Tất cả
        </button>
        <button class="filter-btn" data-filter="near-me">
          <i class="fa-solid fa-location-crosshairs" style="width: 20px"></i>
          Gần tôi (5km)
        </button>
        <button class="filter-btn" data-filter="Du lịch">
          <i class="fa-solid fa-mountain-sun" style="width: 20px"></i> Du lịch
        </button>
        <button class="filter-btn" data-filter="Quán ăn">
          <i class="fa-solid fa-utensils" style="width: 20px"></i> Ăn uống
        </button>
        <button class="filter-btn" data-filter="Khách sạn">
          <i class="fa-solid fa-bed" style="width: 20px"></i> Lưu trú
        </button>
        <hr style="border: 0; border-top: 1px dashed #cbd5e1; margin: 4px 0" />
        <div
          style="display: flex; justify-content: space-around; padding: 4px 0"
        >
          <button id="btn-satellite" class="map-style-btn" title="Vệ tinh">
            <i class="fa-solid fa-satellite"></i>
          </button>
          <button
            id="btn-street"
            class="map-style-btn active"
            title="Đường phố"
          >
            <i class="fa-solid fa-road"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- THANH QUẢN TRỊ / NAVBAR ĐÁY (PC & MOBILE) -->
    <div id="auth-section" class="admin-access-btn">
      <a id="btn-open-itinerary" style="cursor: pointer"
        ><i class="fa-solid fa-map" style="color: #0052cc"></i> Lộ trình</a
      >
      <span class="separator"></span>
      <a id="btn-leaderboard-in" style="cursor: pointer"
        ><i class="fa-solid fa-trophy" style="color: #f59e0b"></i>Xếp Hạng</a
      >
      <span class="separator"></span>
      <a id="btn-show-bookmarks" style="cursor: pointer"
        ><i class="fa-solid fa-heart" style="color: #ef4444"></i> Đã lưu</a
      >

      <!-- Nút Hồ Sơ luôn luôn hiện để user có thể bấm vào đăng nhập -->
      <span class="separator"></span>
      <a href="profile.html" id="btn-profile"
        ><i class="fa-solid fa-user" style="color: #8b5cf6"></i> Hồ sơ</a
      >

      <!-- Nút Quản Trị mặc định bị ẩn (display: none), JS sẽ tự bật nếu là Admin -->
      <span class="separator" id="admin-separator" style="display: none"></span>
      <a
        href="dashboard.html"
        id="btn-admin"
        style="display: none; color: #10b981"
        ><i class="fa-solid fa-chart-pie"></i> Quản trị</a
      >
    </div>

    <!-- SIDEBAR THÔNG TIN ĐỊA ĐIỂM -->
    <div id="info-sidebar" class="sidebar">
      <div class="gallery-header">
        <div class="carousel-container" id="sb-carousel"></div>
        <button
          id="sb-carousel-prev"
          class="carousel-btn prev-btn"
          style="display: none"
        >
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button
          id="sb-carousel-next"
          class="carousel-btn next-btn"
          style="display: none"
        >
          <i class="fa-solid fa-chevron-right"></i>
        </button>
        <div class="carousel-indicators" id="sb-carousel-indicators"></div>
        <button class="close-btn" id="close-sidebar">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="drag-handle"></div>

      <div class="sb-content">
        <h2 id="sb-title">Tên địa điểm</h2>
        <div style="display: flex; align-items: center; gap: 10px">
          <span id="sb-category" class="sb-badge"></span>
          <span
            id="sb-distance"
            class="sb-distance-badge"
            style="display: none"
          ></span>
        </div>

        <div class="sb-actions">
          <button id="btn-checkin">
            <i class="fa-solid fa-map-pin"></i> Check-in
          </button>
          <button id="btn-bookmark">
            <i class="fa-regular fa-bookmark"></i> Lưu
          </button>
          <button id="btn-directions">
            <i class="fa-solid fa-route"></i> Chỉ đường
          </button>
          <button id="btn-audio">
            <i class="fa-solid fa-volume-high"></i> Nghe
          </button>
        </div>

        <p id="sb-desc"></p>
        <div id="sb-prices"></div>

        <div class="reviews-section">
          <h3 style="font-size: 16px; margin-bottom: 10px">
            Đánh giá (<span id="review-count">0</span>)
          </h3>
          <div id="reviews-list"></div>

          <div class="review-form-modern">
            <h4
              style="
                margin-top: 0;
                margin-bottom: 15px;
                font-size: 15px;
                color: #1e293b;
                display: flex;
                align-items: center;
                gap: 8px;
              "
            >
              <i class="fa-solid fa-pen-nib" style="color: #3b82f6"></i> Viết
              đánh giá
            </h4>

            <input
              type="text"
              id="reviewer-name"
              class="modern-input"
              placeholder="Tên của bạn..."
            />

            <select id="review-rating" class="modern-input">
              <option value="5">⭐⭐⭐⭐⭐ Tuyệt vời</option>
              <option value="4">⭐⭐⭐⭐ Rất tốt</option>
              <option value="3">⭐⭐⭐ Bình thường</option>
              <option value="2">⭐⭐ Kém</option>
              <option value="1">⭐ Rất kém</option>
            </select>

            <textarea
              id="review-text"
              class="modern-input"
              rows="3"
              placeholder="Chia sẻ trải nghiệm của bạn về địa điểm này..."
            ></textarea>

            <!-- Nút Upload Ảnh Custom -->
            <div class="file-upload-wrapper">
              <input
                type="file"
                id="review-image"
                accept="image/*"
                multiple
                hidden
              />
              <label for="review-image" class="modern-file-label">
                <i class="fa-solid fa-camera"></i>
                <span id="review-file-name">Đính kèm ảnh (Tùy chọn)</span>
              </label>
            </div>

            <!-- Khung chứa danh sách ảnh chuẩn bị upload -->
            <div
              id="review-image-preview-container"
              class="review-gallery-preview"
            ></div>
            <div
              id="review-upload-status"
              style="
                display: none;
                font-size: 12px;
                color: #0052cc;
                margin-bottom: 10px;
              "
            >
              <i class="fa-solid fa-spinner fa-spin"></i> Đang tải ảnh lên...
            </div>

            <button id="submit-review-btn" class="modern-submit-btn">
              <i class="fa-solid fa-paper-plane"></i> Gửi Đánh Giá
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL ĐỊA ĐIỂM ĐÃ LƯU -->
    <div id="bookmarks-modal" class="bm-modal">
      <div class="bm-content">
        <div class="bm-header">
          <h3>
            <i class="fa-solid fa-heart" style="color: #ef4444"></i> Địa điểm đã
            lưu
          </h3>
          <button
            id="close-bm-modal"
            style="
              background: none;
              border: none;
              font-size: 20px;
              cursor: pointer;
            "
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <ul id="bookmarks-list" class="bm-list"></ul>
      </div>
    </div>

    <!-- MODAL BẢNG XẾP HẠNG -->
    <div id="leaderboard-modal" class="bm-modal">
      <div class="bm-content">
        <div class="bm-header">
          <h3>
            <i class="fa-solid fa-trophy" style="color: #f59e0b"></i> Bảng Xếp
            Hạng
          </h3>
          <button
            id="close-lb-modal"
            style="
              background: none;
              border: none;
              font-size: 20px;
              cursor: pointer;
            "
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <ul id="leaderboard-list" class="bm-list"></ul>
      </div>
    </div>

    <!-- MODAL LỊCH TRÌNH THÔNG MINH -->
    <div id="itinerary-modal" class="bm-modal">
      <div class="bm-content" style="padding: 20px">
        <h2
          id="itinerary-greeting"
          style="margin-top: 0; margin-bottom: 15px; font-size: 18px"
        >
          Lên lịch trình
        </h2>

        <div style="margin-bottom: 15px">
          <span class="iti-label">Thời gian:</span>
          <div class="chip-group">
            <label class="chip"
              ><input
                type="radio"
                name="iti_time"
                value="2"
                checked
                style="display: none"
              /><span>2 Tiếng</span></label
            >
            <label class="chip"
              ><input
                type="radio"
                name="iti_time"
                value="4"
                style="display: none"
              /><span>Nửa ngày</span></label
            >
            <label class="chip"
              ><input
                type="radio"
                name="iti_time"
                value="6"
                style="display: none"
              /><span>Cả ngày</span></label
            >
          </div>
        </div>

        <div style="margin-bottom: 15px">
          <span class="iti-label">Phương tiện:</span>
          <div class="chip-group">
            <label class="chip"
              ><input
                type="radio"
                name="iti_vehicle"
                value="driving"
                checked
                style="display: none"
              /><span>Xe máy/Ô tô</span></label
            >
            <label class="chip"
              ><input
                type="radio"
                name="iti_vehicle"
                value="walking"
                style="display: none"
              /><span>Đi bộ</span></label
            >
          </div>
        </div>

        <div style="margin-bottom: 15px">
          <span class="iti-label">Đối tượng:</span>
          <div class="chip-group">
            <label class="chip"
              ><input
                type="radio"
                name="iti_companion"
                value="friends"
                checked
                style="display: none"
              /><span>Bạn bè</span></label
            >
            <label class="chip"
              ><input
                type="radio"
                name="iti_companion"
                value="family"
                style="display: none"
              /><span>Gia đình</span></label
            >
          </div>
        </div>

        <div style="margin-bottom: 20px">
          <span class="iti-label">Sở thích:</span>
          <div class="chip-group">
            <label class="chip"
              ><input
                type="checkbox"
                class="iti-pref"
                value="Du lịch"
                checked
                style="display: none"
              /><span>Du lịch</span></label
            >
            <label class="chip"
              ><input
                type="checkbox"
                class="iti-pref"
                value="Quán ăn"
                checked
                style="display: none"
              /><span>Ăn uống</span></label
            >
          </div>
        </div>

        <button id="btn-generate-route" class="btn-primary" style="width: 100%">
          Tính toán lộ trình
        </button>
        <button
          id="close-itinerary-modal"
          style="
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border: none;
            background: #e2e8f0;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
          "
        >
          Hủy
        </button>
      </div>
    </div>

    <!-- 4. GỌI LOGIC SAU KHI ĐÃ CÓ DOM VÀ CẤU HÌNH -->
    <script src="config.js"></script>
    <script src="script.js" defer></script>
  </body>
</html>
