<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <!-- Khóa khung hình, tự động phóng to chữ cho điện thoại -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- Chống kẹt Cache -->
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>Bản đồ Du lịch Núi Sập</title>

    <!-- Thư viện FontAwesome và Mapbox -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css"
      rel="stylesheet"
    />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>

    <!-- Thư viện Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CSS của dự án -->
    <link rel="stylesheet" href="style.css?v=2" />
  </head>

  <body>
    <!-- 1. LOADING SCREEN -->
    <div
      id="global-loader"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: white;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      "
    >
      <div style="text-align: center">
        <i
          class="fa-solid fa-map-location-dot fa-bounce fa-3x"
          style="color: #0052cc"
        ></i>
        <h3 style="margin-top: 15px; color: #333">Đang tải dữ liệu...</h3>
      </div>
    </div>

    <!-- 2. BẢN ĐỒ -->
    <div id="map"></div>

    <!-- Nút chuyển đổi kiểu bản đồ -->
    <div
      style="
        position: absolute;
        bottom: 85px;
        right: 10px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 5px;
      "
    >
      <button
        id="btn-street"
        class="map-style-btn active"
        title="Bản đồ đường phố"
      >
        <i class="fa-solid fa-map"></i>
      </button>
      <button id="btn-satellite" class="map-style-btn" title="Bản đồ vệ tinh">
        <i class="fa-solid fa-satellite"></i>
      </button>
    </div>

    <!-- 3. THANH TÌM KIẾM VÀ MENU 3 GẠCH (Nằm ngang nhau) -->
    <div class="top-control-group">
      <!-- Khung tìm kiếm -->
      <div id="search-container">
        <i
          class="fa-solid fa-magnifying-glass search-icon"
          style="color: #64748b; margin-left: 10px"
        ></i>
        <input
          type="text"
          id="search-input"
          placeholder="Tìm kiếm địa điểm..."
          autocomplete="off"
        />
        <button id="voice-search-btn" title="Tìm kiếm bằng giọng nói">
          <i class="fa-solid fa-microphone"></i>
        </button>
        <ul id="search-results"></ul>
      </div>

      <!-- Nút 3 gạch -->
      <button id="mobile-filter-toggle" class="filter-toggle-btn">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>

    <!-- 4. KHUNG LỌC DANH MỤC (Menu sổ xuống) -->
    <div id="filter-menu" class="filter-dropdown">
      <button class="filter-btn active" data-filter="all">
        <i class="fa-solid fa-border-all"></i> Tất cả
      </button>
      <button class="filter-btn" data-filter="Du lịch">
        <i class="fa-solid fa-mountain-sun"></i> Du lịch
      </button>
      <button class="filter-btn" data-filter="Quán ăn">
        <i class="fa-solid fa-utensils"></i> Quán ăn
      </button>
      <button class="filter-btn" data-filter="Khách sạn">
        <i class="fa-solid fa-hotel"></i> Khách sạn
      </button>
      <div style="height: 1px; background: #e2e8f0; margin: 5px 0"></div>
      <button
        class="filter-btn"
        data-filter="near-me"
        style="color: #0052cc; font-weight: 700"
      >
        <i class="fa-solid fa-location-crosshairs"></i> Gần tôi
      </button>
      <button
        id="btn-open-itinerary"
        class="filter-btn"
        style="color: #10b981; font-weight: 700"
      >
        <i class="fa-solid fa-wand-magic-sparkles"></i> Lịch trình
      </button>
    </div>

    <!-- 5. THANH TÀI KHOẢN (BOTTOM NAVIGATION) -->
    <div id="auth-section" class="admin-access-btn">
      <a
        href="#"
        id="btn-leaderboard-out"
        class="action-txt"
        style="color: #f59e0b; font-weight: 700; text-decoration: none"
      >
        <i class="fa-solid fa-trophy"></i> Xếp hạng
      </a>
      <div class="separator"></div>
      <a
        href="auth.html"
        class="action-txt"
        style="text-decoration: none; color: #333; font-weight: 600"
      >
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng nhập
      </a>
    </div>

    <!-- 6. SIDEBAR THÔNG TIN ĐỊA ĐIỂM -->
    <div id="info-sidebar" class="sidebar">
      <button id="close-sidebar" class="close-btn">&times;</button>
      <div class="drag-handle"></div>

      <!-- Slider ảnh -->
      <div class="sb-image-slider">
        <div class="carousel" id="sb-carousel"></div>
        <button class="carousel-btn prev" id="sb-carousel-prev">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button class="carousel-btn next" id="sb-carousel-next">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
        <div class="carousel-indicators" id="sb-carousel-indicators"></div>
      </div>

      <div class="sb-content">
        <h2 id="sb-title">Tên địa điểm</h2>
        <span id="sb-category" class="sb-badge">Danh mục</span>
        <span
          id="sb-distance"
          class="sb-distance-badge"
          style="display: none"
        ></span>

        <p id="sb-desc">Mô tả địa điểm sẽ hiển thị ở đây...</p>

        <!-- Các nút hành động -->
        <div class="sb-actions">
          <button class="btn-primary" id="btn-directions">
            <i class="fa-solid fa-route"></i> Đường đi
          </button>
          <button class="btn-secondary" id="btn-audio">
            <i class="fa-solid fa-volume-high"></i> Nghe
          </button>
          <button class="btn-secondary" id="btn-checkin">
            <i class="fa-solid fa-map-pin"></i> Check-in
          </button>
          <button class="btn-secondary" id="btn-bookmark">
            <i class="fa-regular fa-bookmark"></i> Lưu
          </button>
        </div>

        <!-- Khu vực đánh giá -->
        <div class="reviews-section">
          <h3>
            <i class="fa-solid fa-comments"></i> Đánh giá (<span
              id="review-count"
              >0</span
            >)
          </h3>

          <div class="review-form">
            <input
              type="text"
              id="reviewer-name"
              placeholder="Tên của bạn"
              class="form-input"
            />
            <select id="review-rating" class="form-input">
              <option value="5">⭐⭐⭐⭐⭐ (Tuyệt vời)</option>
              <option value="4">⭐⭐⭐⭐ (Tốt)</option>
              <option value="3">⭐⭐⭐ (Bình thường)</option>
              <option value="2">⭐⭐ (Kém)</option>
              <option value="1">⭐ (Rất tệ)</option>
            </select>
            <textarea
              id="review-text"
              placeholder="Chia sẻ trải nghiệm của bạn..."
              class="form-input"
              rows="3"
            ></textarea>

            <label
              for="review-image"
              class="file-upload-label"
              style="
                display: inline-block;
                margin-bottom: 10px;
                cursor: pointer;
                color: #0052cc;
                font-size: 14px;
              "
            >
              <i class="fa-solid fa-camera"></i> Đính kèm ảnh
            </label>
            <input
              type="file"
              id="review-image"
              accept="image/*"
              style="display: none"
            />
            <img
              id="review-img-preview"
              style="
                display: none;
                width: 100%;
                max-height: 200px;
                object-fit: cover;
                border-radius: 8px;
                margin-bottom: 10px;
              "
            />
            <p
              id="review-upload-status"
              style="
                display: none;
                color: #f59e0b;
                font-size: 13px;
                margin-bottom: 10px;
              "
            >
              <i class="fa-solid fa-spinner fa-spin"></i> Đang tải ảnh lên...
            </p>

            <button
              id="submit-review-btn"
              class="btn-primary"
              style="width: 100%"
            >
              Gửi đánh giá
            </button>
          </div>

          <div id="reviews-list" class="reviews-list"></div>
        </div>
      </div>
    </div>

    <!-- 7. MODALS -->
    <!-- Modal Địa điểm đã lưu -->
    <div id="bookmarks-modal" class="bm-modal">
      <div class="bm-content">
        <div class="bm-header">
          <h3>
            <i class="fa-solid fa-heart" style="color: #ef4444"></i> Đã Lưu
          </h3>
          <button
            id="close-bm-modal"
            class="close-btn"
            style="position: static; width: 28px; height: 28px"
          >
            &times;
          </button>
        </div>
        <ul id="bookmarks-list" class="bm-list"></ul>
      </div>
    </div>

    <!-- Modal Bảng xếp hạng -->
    <div id="leaderboard-modal" class="bm-modal">
      <div class="bm-content">
        <div class="bm-header">
          <h3>
            <i class="fa-solid fa-trophy" style="color: #f59e0b"></i> Bảng Xếp
            Hạng
          </h3>
          <button
            id="close-lb-modal"
            class="close-btn"
            style="position: static; width: 28px; height: 28px"
          >
            &times;
          </button>
        </div>
        <ul id="leaderboard-list" class="bm-list"></ul>
      </div>
    </div>

    <!-- Modal Smart Itinerary (Lên lịch trình V2) -->
    <div id="itinerary-modal" class="bm-modal">
      <div class="bm-content" style="max-width: 450px">
        <div class="bm-header">
          <h3 style="font-size: 17px">
            <i
              class="fa-solid fa-wand-magic-sparkles"
              style="color: #10b981"
            ></i>
            <span id="itinerary-greeting">Thiết Kế Lịch Trình</span>
          </h3>
          <button
            id="close-itinerary-modal"
            class="close-btn"
            style="position: static; width: 28px; height: 28px"
          >
            &times;
          </button>
        </div>

        <div style="padding: 15px 20px; overflow-y: auto">
          <!-- Thời gian -->
          <label class="iti-label">Bạn có bao nhiêu thời gian?</label>
          <div class="chip-group">
            <label class="chip">
              <input type="radio" name="iti_time" value="2" checked hidden />
              <span>2 tiếng</span>
            </label>
            <label class="chip">
              <input type="radio" name="iti_time" value="4" hidden />
              <span>Nửa ngày</span>
            </label>
            <label class="chip">
              <input type="radio" name="iti_time" value="8" hidden />
              <span>Cả ngày</span>
            </label>
          </div>

          <!-- Phương tiện -->
          <label class="iti-label">Phương tiện di chuyển?</label>
          <div class="chip-group">
            <label class="chip">
              <input
                type="radio"
                name="iti_vehicle"
                value="driving"
                checked
                hidden
              />
              <span>🏍️ Xe máy/Ô tô</span>
            </label>
            <label class="chip">
              <input type="radio" name="iti_vehicle" value="walking" hidden />
              <span>🚶 Đi bộ</span>
            </label>
          </div>

          <!-- Đồng hành -->
          <label class="iti-label">Bạn đi cùng ai?</label>
          <div class="chip-group">
            <label class="chip">
              <input
                type="radio"
                name="iti_companion"
                value="solo"
                checked
                hidden
              />
              <span>😎 Một mình / Cặp đôi</span>
            </label>
            <label class="chip">
              <input type="radio" name="iti_companion" value="family" hidden />
              <span>👨‍👩‍👧‍‍👦 Gia đình (Chậm rãi)</span>
            </label>
          </div>

          <!-- Sở thích -->
          <label class="iti-label">Trải nghiệm mong muốn (Chọn nhiều)</label>
          <div class="chip-group">
            <label class="chip">
              <input
                type="checkbox"
                class="iti-pref"
                value="Du lịch"
                checked
                hidden
              />
              <span>📸 Tham quan</span>
            </label>
            <label class="chip">
              <input
                type="checkbox"
                class="iti-pref"
                value="Quán ăn"
                checked
                hidden
              />
              <span>🍜 Ăn uống</span>
            </label>
            <label class="chip">
              <input
                type="checkbox"
                class="iti-pref"
                value="Khách sạn"
                hidden
              />
              <span>🛌 Nghỉ ngơi</span>
            </label>
          </div>

          <button
            id="btn-generate-route"
            class="btn-primary-sm"
            style="
              background: #10b981;
              margin-top: 10px;
              font-size: 15px;
              padding: 12px;
              width: 100%;
              border: none;
              color: white;
              border-radius: 8px;
              cursor: pointer;
            "
          >
            <i class="fa-solid fa-route"></i> Bắt đầu chuyến đi!
          </button>
        </div>
      </div>
    </div>

    <!-- Nhúng Toast Notification -->
    <script src="https://cdn.jsdelivr.net/gh/mickidum/toast_ui/toast.min.js"></script>
    <!-- File cấu hình Supabase (nếu có tách riêng) -->
    <script src="config.js?v=2"></script>
    <!-- File Script chính (có thêm ?v=2 để tự xóa cache) -->
    <script src="script.js?v=2"></script>
  </body>
</html>
