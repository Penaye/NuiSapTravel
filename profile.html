<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Trang cá nhân - Núi Sập Map</title>
    <link rel="stylesheet" href="toast.css" />
    <script src="toast.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="dashboard.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Gắn cấu hình và logic -->
    <script src="config.js" defer></script>
    <script src="profile.js" defer></script>
    <style>
      .profile-container {
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
      }
      .header-back {
        display: inline-block;
        margin-bottom: 20px;
        text-decoration: none;
        color: #64748b;
        font-weight: 600;
      }
      .header-back:hover {
        color: #0052cc;
      }
      .card-box {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        margin-bottom: 30px;
      }

      .avatar-wrapper {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 20px;
      }
      .avatar-preview {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #e2e8f0;
      }

      .my-review-item {
        display: flex;
        flex-direction: column;
        padding: 15px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        margin-bottom: 15px;
        background: #f8fafc;
      }
      .mr-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 10px;
      }
      .mr-loc-name {
        font-weight: bold;
        font-size: 16px;
        color: #1e293b;
      }
      .mr-rating {
        color: #f59e0b;
        font-size: 14px;
      }
      .mr-date {
        font-size: 12px;
        color: #94a3b8;
      }
      .mr-img {
        max-width: 150px;
        border-radius: 6px;
        margin-top: 10px;
      }
      .mr-actions {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }
    </style>
  </head>
  <body style="background-color: #f4f7fe">
    <div class="profile-container">
      <a href="index.html" class="header-back"
        ><i class="fa-solid fa-arrow-left"></i> Quay lại bản đồ</a
      >
      <h2 style="margin-bottom: 20px; color: #1e293b">Trang Cá Nhân</h2>

      <!-- Box: Cập nhật thông tin -->
      <div class="card-box">
        <h3
          style="
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
          "
        >
          Cập nhật thông tin
        </h3>
        <div class="avatar-wrapper">
          <img
            id="profile-avatar-preview"
            class="avatar-preview"
            src="https://placehold.co/200x200/e2e8f0/a3aed1?text=User"
          />
          <div>
            <label
              style="
                display: block;
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 5px;
              "
              >Ảnh đại diện (Avatar):</label
            >
            <input
              type="file"
              id="profile-avatar-file"
              accept="image/*"
              class="form-input"
              style="padding: 5px; width: auto"
            />
          </div>
        </div>
        <div style="max-width: 400px">
          <label
            style="
              display: block;
              font-size: 13px;
              font-weight: 600;
              margin-bottom: 5px;
            "
            >Tên hiển thị:</label
          >
          <input
            type="text"
            id="profile-name"
            class="form-input"
            placeholder="Nhập họ và tên..."
          />
          <button
            id="btn-save-profile"
            class="btn btn-primary"
            style="margin-top: 10px"
          >
            Lưu Thay Đổi
          </button>
        </div>
      </div>

      <!-- Box: Danh sách đánh giá -->
      <div class="card-box">
        <h3
          style="
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
          "
        >
          Đánh giá của bạn
        </h3>
        <div id="my-reviews-list">
          <p style="text-align: center; color: #666">
            <i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
